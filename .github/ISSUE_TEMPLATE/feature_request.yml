name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of the problem or limitation.
      placeholder: e.g. Currently table content inside PDFs is ignored during parsing...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see implemented? Include any ideas or references.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered (optional)
      description: Any alternative approaches or workarounds you have tried.
  - type: textarea
    id: context
    attributes:
      label: Additional context (optional)
      description: Screenshots, papers, docs, or anything else that helps.
